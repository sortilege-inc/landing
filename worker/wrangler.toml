name = "sortilege-onboarding"
main = "src/index.js"
compatibility_date = "2026-08-19"

[vars]
# Mailgun region: "us" -> api.mailgun.net, "eu" -> api.eu.mailgun.net
MG_REGION = "us"

# The verified sending domain in your Mailgun account (e.g. mg.sortilege.online).
MG_DOMAIN = "mg.sortilege.online"

# Where submissions land. Comma-separated: Mailgun accepts multiple recipients.
# The Gmail address is deliberate redundancy — mail for sortilege.online is
# delivered to Google Workspace (its MX), not to the PrivateEmail mailbox, so a
# single recipient made delivery depend on which mailbox was being watched.
MG_TO = "jordan@sortilege.online,hewhocutsdown@gmail.com"

# Comma-separated origins allowed to POST here. The first is used as the
# fallback CORS origin. Two sites share this Worker, each a GitHub Pages
# custom domain set by the CNAME file in its own repo:
#   landing.sortilege.online  — the onboarding form, this repo
#   rsvp.sortilege.online     — event registration, the registration repo
# Their dev ports (4317 and 4318) are kept for local testing; drop them
# before going live if you would rather not accept local submissions.
ALLOWED_ORIGIN = "https://landing.sortilege.online,http://localhost:4317,https://rsvp.sortilege.online,http://localhost:4318"

# MAILGUN_API_KEY is a SECRET and is deliberately absent from this file.
# Set it yourself, from your own shell:
#   npx wrangler secret put MAILGUN_API_KEY
